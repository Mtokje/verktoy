<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Utplassering – admin (lokal reserve)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: rolig arbeidsverktøy for koordinator – saklig, raskt å skanne, ingen pynt
   IDEA: planleggingstavla på kontoret – ukerader med fargede lapper per skoleklasse
   PICTURE: fristelista og ukekalenderen er selve bildet; statusfargene bærer innholdet
   COLOUR and TYPE: himmelblått toppfelt, blekk #10223a, oransje kun for forfalt; Outfit + Inter
   LAYOUT: toppbånd med navigasjon (bunnmeny på mobil), én kolonne maks 1100px, ark for detaljer */
:root{color-scheme:light dark;--bg:light-dark(#f4f7fa,#0b1726);--card:light-dark(#fff,#12233a);--ink:light-dark(#10223a,#e8eef6);--mut:light-dark(#5a6a7e,#9fb0c4);--line:light-dark(#dbe3ec,#253a52);--sky:light-dark(#4fb3e8,#1d5a80);--skyink:light-dark(#0b2238,#eaf6ff);--or:#ff7a1a;--orbg:light-dark(#fff0e3,#3b2412);--orink:light-dark(#9a3d00,#ffb37a);--soft:light-dark(#eef3f8,#18304b);--ok:light-dark(#157a43,#5fd38e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;padding-bottom:84px}
h1,h2,h3{font-family:Outfit,Inter,sans-serif;font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(24px,4vw,32px)}h2{font-size:20px}h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--sky);color:var(--skyink)}
.top-in{max-width:1100px;margin:0 auto;padding:14px max(4vw,16px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.brand b{font:600 20px Outfit,Inter,sans-serif}.brand span{font-size:13px;opacity:.85}
.tabs{display:flex;gap:4px}
.tabs a,.bnav a{color:inherit;text-decoration:none;border-radius:10px;font-weight:500;position:relative}
.tabs a{padding:10px 14px}
.tabs a[aria-current=page]{background:light-dark(rgba(255,255,255,.55),rgba(0,0,0,.28))}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--or);color:#fff;font-size:12px;font-weight:600;text-align:center;line-height:20px;margin-left:6px}
.bnav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:none;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:20}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 2px;min-height:52px;justify-content:center}
.bnav a[aria-current=page]{color:light-dark(#0b6fa8,#7cc8f2);background:var(--soft)}
.bnav svg{width:22px;height:22px}
.bnav .badge{position:absolute;top:2px;right:14%;margin:0}
main{max-width:1100px;margin:0 auto;padding:20px max(4vw,16px) 40px}
.note{font-size:14px;color:var(--mut);margin:0 0 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note.warn{background:var(--orbg);color:var(--orink);padding:10px 12px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(4,minmax(0,1fr));margin:14px 0 22px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font:600 clamp(26px,5vw,36px)/1.1 Outfit,Inter,sans-serif}
.tile span{font-size:13px;color:var(--mut)}
.tile.hot{background:var(--orbg);border-color:transparent}.tile.hot b{color:var(--orink)}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.sec small{color:var(--mut);font-size:14px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:14px;border-bottom:1px solid var(--line);align-items:start}
.task:last-child{border-bottom:0}
.due{font-size:13px;font-weight:600;white-space:nowrap;padding:3px 8px;border-radius:8px;background:var(--soft);min-width:78px;text-align:center}
.due.over{background:var(--or);color:#fff}.due.now{background:var(--sky);color:var(--skyink)}
.task .t{font-weight:600}.task .s{font-size:14px;color:var(--mut)}
.task .acts{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.btn{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px}
.btn.pri{background:#10223a;color:#fff;border-color:#10223a}
:root[data-theme=dark] .btn.pri{background:#4fb3e8;color:#0b1726;border-color:#4fb3e8}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.pri{background:#4fb3e8;color:#0b1726;border-color:#4fb3e8}}
.btn.dan{color:#c62f34;border-color:#e5a3a5}
.btn.ghost{border-color:transparent;background:transparent}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #ff7a1a;outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;border:2px solid transparent}
.mark{font-size:11px;font-weight:700;background:rgba(255,255,255,.3);border-radius:6px;padding:0 5px}
.eks{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:6px;background:#ffe08a;color:#5a4300}
.avk{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--orbg);color:var(--orink);border:1px dashed var(--or)}
.chip{display:inline-block;font-size:13px;padding:2px 9px;border-radius:999px;background:var(--soft);margin:2px 4px 2px 0}
.chip.q{background:transparent;border:1px dashed var(--mut)}
.req{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px 14px;cursor:pointer;margin-bottom:10px}
.req .top2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.req .meta{font-size:14px;color:var(--mut);margin-top:4px}
.prog{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;display:flex;margin-top:8px}
.prog i{display:block;height:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.filters button{min-height:38px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.filters button[aria-pressed=true]{background:#10223a;color:#fff;border-color:#10223a}
.week{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.week:last-child{border-bottom:0}
.week.cur{background:var(--soft)}.week.tom{padding-block:8px}.week.tom .wk b{font-size:15px;display:inline}
.wk b{font:600 18px Outfit,Inter,sans-serif;display:block}.wk span{font-size:13px;color:var(--mut)}
.sums{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sum{font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px}
.slot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;width:100%;text-align:left;border:0;border-left:5px solid var(--c);background:var(--card);box-shadow:0 0 0 1px var(--line) inset;border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.slot.dash{border-left-style:dashed}
.slot small{color:var(--mut)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:15px;margin:0}
.dl dt{color:var(--mut)}.dl dd{margin:0}
.kv{font-size:14px;color:var(--mut)}
.gap{background:var(--orbg);border-radius:14px;padding:14px;margin:12px 0 18px}
.hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.hd>*:first-child{flex:1 1 auto}.hd .btn{flex:none}
.avd h3{margin-bottom:4px}.avd .r{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.avd .r>span:first-child{color:var(--mut)}
.sheet{position:fixed;inset:0;z-index:50}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(8,20,36,.5)}
.sheet-panel{position:absolute;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);overflow-y:auto;overscroll-behavior:contain;box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.sh-head{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center}
.sh-head h2{margin-right:auto}
.sh-body{padding:16px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.blk>h3{margin-bottom:10px}
.line{border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld>span{font-size:14px;font-weight:500}
.fld small{color:var(--mut);font-size:13px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px}
textarea{min-height:120px;line-height:1.45}
.two{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.chk{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:4px 12px 4px 8px;border:1px solid var(--line);border-radius:999px;margin:3px 6px 3px 0;cursor:pointer;background:var(--card);font-size:14px}
.chk input{width:18px;height:18px;margin:0}
.chk.big{border-radius:10px;width:100%;min-height:48px}
.tri{min-height:40px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;margin:3px 6px 3px 0;background:var(--card);cursor:pointer;font-size:14px}
.tri[data-s="1"]{background:#10223a;color:#fff;border-color:#10223a}
.tri[data-s="2"]{border:2px dashed #10223a;font-weight:600}
:root[data-theme=dark] .tri[data-s="1"]{background:#4fb3e8;color:#0b1726}
.forslag{background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.mailrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mailrow:first-of-type{border-top:0}
.sent{color:var(--ok);font-weight:600;font-size:14px}
.notsent{color:var(--mut);font-size:14px}
.empty{padding:22px;text-align:center;color:var(--mut)}
.rq{color:#d4343a;margin-left:3px;font-weight:700}
.reqnote{font-size:14px;color:var(--mut);margin:0 0 12px}
.fld.err>span{color:#c62f34}
.fld.err input,.fld.err select{border:2px solid #d4343a;background:light-dark(#fff2f2,#3a1416)}
.fld.err .chk{border:2px solid #d4343a;background:light-dark(#fff2f2,#3a1416)}
.rcal{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;background:var(--card)}
.rc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.rc-h b{font:600 17px Outfit,Inter,sans-serif}
.rc-g{display:grid;grid-template-columns:46px repeat(7,minmax(0,1fr));gap:3px}
.rc-g .hd{font-size:12px;color:var(--mut);text-align:center;padding:2px 0}
.rc-w{font-size:12px;font-weight:600;color:var(--mut);border:1px dashed var(--line);border-radius:8px;background:transparent;min-height:42px;cursor:pointer;padding:0}
.rc-w:hover{border-color:var(--mut)}
.rc-d{min-height:42px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-size:15px;padding:0}
.rc-d.we{color:var(--mut)}.rc-d.out{visibility:hidden}
.rc-d.in{background:light-dark(#d6ecfa,#1d4566);border-radius:0}
.rc-d.s,.rc-d.e{background:#10223a;color:#fff;font-weight:600}
:root[data-theme=dark] .rc-d.s,:root[data-theme=dark] .rc-d.e{background:#4fb3e8;color:#0b1726}
.rc-d.today:not(.s):not(.e){box-shadow:inset 0 0 0 2px var(--sky)}
.rc-sum{font-size:14px;margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fld .errtxt{color:#c62f34;font-size:13px;font-weight:600}
.note.gul{background:light-dark(#fff6cc,#3a3210);color:light-dark(#5a4300,#ffe08a);padding:10px 12px;border-radius:10px}
.confirm{background:var(--orbg);border-radius:10px;padding:10px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#10223a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.logg{font-size:13px;color:var(--mut);margin:0;padding-left:18px}
.noscroll{overflow:hidden}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg a{padding:8px 16px;text-decoration:none;color:inherit;font-weight:500;min-height:42px;display:flex;align-items:center}
.seg a[aria-current=page]{background:#10223a;color:#fff}
.kwrap{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);margin-top:12px}
.kmap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(64px,.9fr) minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.kcol{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.kl{grid-column:1}.kr{grid-column:3}
.khead{font-size:12px;font-weight:600;color:var(--mut);text-transform:none;margin:2px 0}
.kgrp{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin:8px 0 0}
.kgrp i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.ktile{text-align:left;border:1px solid var(--line);border-left:5px solid var(--c);background:var(--card);border-radius:10px;padding:6px 26px 6px 9px;cursor:pointer;font-size:14px;line-height:1.25;min-height:44px;position:relative}
.kr .ktile{border-left-width:1px;border-left-color:var(--line);border-right:5px solid #10223a;padding:6px 9px 6px 26px}
.ktile{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.ktile small{display:block;color:var(--mut);font-size:12px}
.ktile .kn{position:absolute;top:5px;right:7px;font-size:11px;font-weight:700;color:var(--mut)}
.kr .ktile .kn{right:auto;left:7px}
.ktile.none{opacity:.6;border-style:dashed}
.ktile.sel{outline:3px solid var(--or);outline-offset:1px;opacity:1}
.ktile.dim{opacity:.35}
.kwires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.kwires .hit{pointer-events:stroke;cursor:pointer}
.klabels{position:absolute;inset:0;pointer-events:none;z-index:2}
.klab{position:absolute;transform:translateX(-50%);pointer-events:auto;max-width:var(--mw);display:flex;flex-direction:column;align-items:center;text-align:center;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--card);border:2px solid var(--c);color:var(--ink);cursor:pointer;line-height:1.4}
.klab.q{border-style:dashed}
.klab span{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kfilt{display:grid;gap:8px 10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));margin:4px 0 2px}
.kfilt .fld{margin-bottom:4px}
.kfd>summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center;gap:6px}
@media(min-width:761px){.kfd>summary{display:none}}
.kfilt select.on{border-color:#ff7a1a;box-shadow:0 0 0 1px #ff7a1a inset}
.kpanel{margin:0}
.krow{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.krow:first-of-type{border-top:0}
.kspacer{display:none}
@media(min-width:1000px){.kwrap{grid-template-columns:minmax(0,1fr) 330px}.kpanel{position:sticky;top:16px;align-self:start}}
@media(max-width:999px){.kpanel{position:fixed;left:0;right:0;bottom:0;max-height:40vh;overflow:auto;z-index:15;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.22)}.kpanel.idle{display:none}.kspacer{display:block;height:52vh}}
@media(max-width:760px){.kpanel{bottom:68px}.kmap{padding:10px 6px;grid-template-columns:minmax(0,1fr) minmax(44px,.55fr) minmax(0,1fr)}.ktile{font-size:13px}}
@media(max-width:760px){.tabs{display:none}.bnav{display:grid}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:761px){body{padding-bottom:0}}
@media(max-width:600px){.week{grid-template-columns:minmax(0,1fr);gap:6px}.dl{grid-template-columns:minmax(0,1fr)}.dl dt{margin-top:6px}.two{grid-template-columns:minmax(0,1fr)}.task{grid-template-columns:minmax(0,1fr)}.task .acts{grid-column:1}.due{justify-self:start}}
@media(prefers-reduced-motion:no-preference){.sheet-panel{animation:inn .18s ease-out}@keyframes inn{from{transform:translateX(30px);opacity:.6}}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><b>Utplassering · Stord Yard</b><span>Stord Academy – admin-oversikt (prototype)</span></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main id="view"><p class="empty">Laster …</p></main>
<nav class="bnav" id="bnav"></nav>
<div id="sheet" class="sheet" hidden><div class="sheet-bg" data-act="close"></div><div class="sheet-panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<script id="seed" type="application/json">null</script>
<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const LAEREFAG=["Anleggsmaskinfører","Automatisering","Elektriker","Energimontør","Gjenvinning","Industrimaler","Industrimekaniker","Industrioppmåling","Industrirørlegger","Isolatør","Kran- og løfteoperasjon","Logistikk","NDT-kontrollør","Platearbeider","Sveis","Stillasbygger"];
const ARSAKER=["Ikke kapasitet","Perioden passer ikke","Én dag i uka over tid (innvilges sjelden)","Linje/fag ikke aktuelt","Manglende tilbakemelding fra avdeling","Ikke prioritert (skole/klasse)","Annet"];
const STATUS=[
 {k:'mottatt',n:'Mottatt',c:'#2f80ed',t:'#fff'},
 {k:'vurdering',n:'Til vurdering hos Mats',c:'#8b5cf6',t:'#fff'},
 {k:'behandling',n:'Under behandling',c:'#f5c542',t:'#10223a'},
 {k:'reservert',n:'Reservert',c:'#a7e3b5',t:'#0f3d1f'},
 {k:'bekreftet',n:'Bekreftet',c:'#22a05a',t:'#fff'},
 {k:'gjennomfort',n:'Gjennomført',c:'#4b5563',t:'#fff'},
 {k:'avslatt',n:'Avslått',c:'#e5484d',t:'#fff'},
 {k:'avlyst',n:'Avlyst av skolen',c:'transparent',t:'#d43a3f',b:'2px dashed #e5484d',bar:'#e5484d'}];
const SM=Object.fromEntries(STATUS.map(s=>[s.k,s]));
const L2=[{k:'venter',n:'Venter svar',c:'#f5c542'},{k:'ja',n:'Ja',c:'#22a05a'},{k:'nei',n:'Nei',c:'#e5484d'},{k:'kanikke',n:'Kan ikke avgjøre nå',c:'#8b5cf6'},{k:'ingen',n:'Ingen tilbakemelding',c:'#4b5563'}];
const L2M=Object.fromEntries(L2.map(s=>[s.k,s]));
const CLOSED=['avslatt','avlyst','gjennomfort'];

const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const addWd=(s,n)=>{const d=pd(s);let k=0;while(k<n){d.setDate(d.getDate()+1);if(d.getDay()%6)k++}return ds(d)};
const DG=['søn','man','tir','ons','tor','fre','lør'];
const fm=s=>{if(!s)return'';const d=pd(s);return d.getDate()+'.'+(d.getMonth()+1)+'.'};
const fy=s=>{if(!s)return'';const d=pd(s);return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()};
const isoWeek=s=>{const d=pd(s);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)};
const monday=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const uke=r=>{if(!r.fra)return'periode ikke satt';const a=isoWeek(r.fra),b=isoWeek(r.til||r.fra);return a===b?'uke '+a:'uke '+a+'–'+b};
const periode=r=>r.fra?fy(r.fra)+(r.til&&r.til!==r.fra?'–'+fy(r.til):''):'';
const dueLbl=d=>{const t=today();if(d<t)return'Forfalt '+fm(d);if(d===t)return'I dag';return DG[pd(d).getDay()]+' '+fm(d)};

function migrer(){let n=0;for(const a of S.avd){if(!(a.linjer||[]).length)continue;for(const x of a.linjer){const t=x.slice(0,3),l=x.slice(4);for(const s of cfg().skoler)if(((s.linjer||{})[t]||[]).includes(l)&&!S.kob.some(k=>k.avdId===a.id&&kLk(k)===lk(s.id,t,l))){S.kob.push({id:nyId('k'),skole:s.id,trinn:t,linje:l,avdId:a.id,fag:(a.fag||[]).slice()});n++}}delete a.linjer;n++}return n}
const linjeTxt=r=>((r.trinn||'')+' '+(r.linje||'')).trim();
const antTxt=r=>(r.antall||0)+' elev'+(+r.antall===1?'':'er');
const cnt=r=>{let b=0,res=0,pend=0;const ls=r.avd||[];for(const l of ls){if(l.status==='ja'){if(l.avklart)b+=+l.antall||0;else res+=+l.antall||0}else if(l.status==='venter'||l.status==='kanikke')pend++}
 if(!ls.length){if(['bekreftet','gjennomfort'].includes(r.status))b=+r.antall||0;else if(r.status==='reservert')res=+r.antall||0}return{b,res,pend}};
function forslag(r){
 const t=today(),{b,res,pend}=cnt(r);
 if(r.status==='bekreftet'&&r.til&&r.til<t)return{s:'gjennomfort'};
 if(!['mottatt','behandling','reservert','bekreftet'].includes(r.status)||!(r.avd||[]).length)return null;
 const tot=b+res;let s;
 if(tot===0&&pend===0){const ing=r.avd.some(l=>l.status==='ingen');return r.status==='avslatt'?null:{s:'avslatt',arsak:ing?'Manglende tilbakemelding fra avdeling':(r.avd.find(l=>l.arsak)?.arsak||'Ikke kapasitet')}}
 if(pend>0&&tot<(+r.antall||0))s='behandling';else if(res>0)s='reservert';else s='bekreftet';
 return s===r.status?null:{s}}
function skoleKey(r){if(r.status==='reservert')return'skole-reservert';if(r.status==='bekreftet')return cnt(r).b<(+r.antall||0)?'skole-delvis':'skole-bekreftet';if(r.status==='avslatt')return'skole-avslatt';return null}
const MALNAVN={'henvendelse':'Første henvendelse','purring1':'Purring','paminnelse':'Påminnelse om reserverte plasser','skole-mottatt':'Svar til skolen: mottatt','skole-reservert':'Svar til skolen: reservert','skole-bekreftet':'Svar til skolen: bekreftet','skole-delvis':'Svar til skolen: delvis','skole-avslatt':'Svar til skolen: avslått'};

function tasks(){
 const T=[],t=today(),f=F();
 for(const r of S.req){
  const sub=`${r.id} · ${kort(r.skole)} · ${linjeTxt(r)} · ${antTxt(r)} · ${uke(r)}`;
  if(r.status==='vurdering')T.push({r,k:'mats',due:null,t:'Avgjør om forespørselen skal prioriteres',s:sub});
  if(r.mottatt&&!r.forsteSvar&&!['avslatt','avlyst'].includes(r.status))T.push({r,due:addWd(r.mottatt,f.svarSkole),t:'Svar til skolen (3-dagersfrist)',s:sub,mal:'skole-mottatt'});
  const sk=skoleKey(r);if(sk&&!(r.sendt||{})[sk])T.push({r,due:r.statusDato||t,t:MALNAVN[sk],s:sub,mal:sk});
  if(CLOSED.includes(r.status))continue;
  (r.avd||[]).forEach((l,i)=>{const n=avdNavn(l.avdId);
   if(l.status==='venter'){
    if(!l.henvendt)T.push({r,li:i,due:l.lagtTil||t,t:'Send henvendelse til '+n,s:sub,mal:'henvendelse'});
    else if(!l.purring1)T.push({r,li:i,due:addWd(l.henvendt,f.purring1),t:'Purring til '+n,s:sub,mal:'purring1'});
    else T.push({r,li:i,due:addWd(l.purring1,f.ingenSvar),t:'Ingen svar fra '+n+' etter purring',s:sub,act:'ingen'});
   }
   if(l.status==='kanikke')T.push({r,li:i,due:l.nySjekk||t,t:'Ny sjekk med '+n,s:sub});
   if(l.status==='ja'&&!l.avklart&&!l.paminnelse&&r.fra)T.push({r,li:i,due:addDays(r.fra,-7*f.paminnelseUker),t:'Påminnelse om reserverte plasser: '+n,s:sub,mal:'paminnelse'});
  });
 }
 return T.sort((a,b)=>(a.due||'').localeCompare(b.due||''));
}

function vCal(){
 const t=today();if(!ui.calStart)ui.calStart=addDays(monday(t),-7);
 const weeks=[];for(let i=0;i<16;i++)weeks.push(addDays(ui.calStart,i*7));
 const rs=S.req.filter(r=>r.fra&&(ui.calAvslag||!['avslatt','avlyst'].includes(r.status)));
 const rows=[];let empty=[];const flush=()=>{if(!empty.length)return;const a=empty[0],z=empty[empty.length-1];rows.push(`<div class="week tom ${empty.includes(monday(t))?'cur':''}"><div class="wk"><b>Uke ${isoWeek(a)}${empty.length>1?'–'+isoWeek(z):''}</b></div><span class="kv">Ingen elever</span></div>`);empty=[]};
 weeks.forEach(m=>{const su=addDays(m,6);const here=rs.filter(r=>r.fra<=su&&(r.til||r.fra)>=m).sort((a,b)=>a.skole.localeCompare(b.skole));
  let B=0,R=0,U=0;const slots=here.map(r=>{const c=cnt(r),s=SM[r.status];let txt='';
   if(['avslatt','avlyst'].includes(r.status))txt=`${r.antall} – ${s.n.toLowerCase()}`;
   else{B+=c.b;R+=c.res;const u=['bekreftet','gjennomfort'].includes(r.status)?0:Math.max(0,(+r.antall||0)-c.b-c.res);U+=u;txt=[c.b?c.b+' bekr.':'',c.res?c.res+' res.':'',u?u+' ikke avklart':''].filter(Boolean).join(' · ')||'0'}
   return`<button class="slot ${r.status==='avlyst'?'dash':''}" style="--c:${s.bar||s.c}" data-act="req" data-id="${esc(r.id)}"><span><b>${esc(kort(r.skole))}</b> · ${esc(linjeTxt(r))} ${eksB(r)}</span><small>${esc(txt)} · ${esc(s.n)}${r.psSendt?' · PS sendt':''}</small></button>`}).join('');
  const sm=(v,l,bg,fg)=>v?`<span class="sum" style="background:${bg};color:${fg}">${v} ${l}</span>`:'';
  if(!here.length){empty.push(m);return}flush();
  rows.push(`<div class="week ${m===monday(t)?'cur':''}"><div class="wk"><b>Uke ${isoWeek(m)}</b><span>${fm(m)}–${fy(addDays(m,4))}</span><div class="sums">${sm(B,'bekreftet','#22a05a','#fff')}${sm(R,'reservert','#a7e3b5','#0f3d1f')}${sm(U,'ikke avklart','#f5c542','#10223a')}</div></div><div>${slots}</div></div>`)});flush();
 return`<div class="row between"><h1>Kalender</h1><div class="row"><button class="btn sm" data-act="cal" data-d="-8">‹ Tidligere</button><button class="btn sm" data-act="cal" data-d="0">Denne uka</button><button class="btn sm" data-act="cal" data-d="8">Senere ›</button></div></div>
 <p class="note">Tallene teller bare bekreftede elever som «bekreftet». Reserverte og ikke avklarte vises hver for seg.</p>
 <div class="legend">${STATUS.map(s=>pill(s.k)).join('')}</div>
 <label class="chk"><input type="checkbox" data-ch="calAvslag" ${ui.calAvslag?'checked':''}> Vis avslåtte og avlyste</label>
 <div class="list" style="margin-top:10px">${rows.join('')}</div>`}

function coverage(){const sure=new Set,uns=new Set;for(const a of S.avd){(a.fag||[]).forEach(f=>sure.add(f));(a.usikre||[]).forEach(f=>uns.add(f))}
 return{uten:LAEREFAG.filter(f=>!sure.has(f)&&!uns.has(f)),kunUsikker:LAEREFAG.filter(f=>!sure.has(f)&&uns.has(f))}}
function avdCome(id){const t=today();let b=0,res=0;for(const r of S.req){if(['avslatt','avlyst','gjennomfort'].includes(r.status)||(r.til||r.fra||'')<t)continue;for(const l of r.avd||[])if(l.avdId===id&&l.status==='ja'){if(l.avklart)b+=+l.antall||0;else res+=+l.antall||0}}return{b,res}}

 ${c.b||c.res?`<div class="r"><span>Kommende</span><span>${c.b} bekreftet · ${c.res} reservert</span></div>`:''}`}</div>`}

function kData(){const all=alleLinjer(ui.kSkole);const keys=new Set(all.map(l=>l.key));const f=ui.kF;
 const base=S.kob.filter(k=>keys.has(kLk(k))&&avdBy(k.avdId));
 const vis=base.filter(k=>(!f.fag||(k.fag||[]).includes(f.fag))&&(!f.avd||k.avdId===f.avd)&&(!f.linje||kLk(k)===f.linje));
 const filt=!!(f.fag||f.avd||f.linje);const usedL=new Set(vis.map(kLk)),usedA=new Set(vis.map(k=>k.avdId));
 const lines=all.filter(l=>!(filt||ui.kSkjul)||usedL.has(l.key));const idx=new Map(lines.map((l,i)=>[l.key,i]));
 const order=S.avd.filter(a=>!a.parent).sort((a,b)=>(a.rek??99)-(b.rek??99)||a.navn.localeCompare(b.navn)).flatMap(a=>[a,...S.avd.filter(p=>p.parent===a.id).sort((x,y)=>x.navn.localeCompare(y.navn))]);
 const bary=a=>{const v=vis.filter(k=>k.avdId===a.id).map(k=>idx.get(kLk(k)));return v.length?v.reduce((x,y)=>x+y,0)/v.length:null};
 const avds=order.filter(a=>!filt||usedA.has(a.id)).map((a,i)=>({a,b:bary(a),i})).sort((x,y)=>(x.b==null)-(y.b==null)||(x.b??0)-(y.b??0)||x.i-y.i).map(x=>x.a);
 return{lines,avds,vis,base,all,filt}}
function vKob(){const{lines,avds,vis,base,all,filt}=kData();const sel=ui.kSel;
 const on=k=>sel&&(sel.t==='linje'?kLk(k)===sel.k:k.avdId===sel.k);
 const near=new Set(sel?vis.filter(on).flatMap(k=>[kLk(k),k.avdId]):[]);
 let lastSk='';const L=lines.map((l,i)=>{const n=vis.filter(k=>kLk(k)===l.key).length;const isSel=sel&&sel.t==='linje'&&sel.k===l.key;
  const head=l.sk.id!==lastSk?`<div class="kgrp" style="--c:${skFarge(l.sk.id)}"><i></i>${esc(l.sk.kort||l.sk.navn)}${l.sk.eksempel?' <span class="eks">EKSEMPEL</span>':''}</div>`:'';lastSk=l.sk.id;
  return head+`<button class="ktile ${n?'':'none'} ${isSel?'sel':sel&&!near.has(l.key)?'dim':''}" style="--c:${skFarge(l.sk.id)}" data-act="ksel" data-t="linje" data-k="${esc(l.key)}" data-ln="${i}"><small>${l.trinn}</small>${esc(l.linje)}${n?`<span class="kn">${n}</span>`:''}</button>`}).join('');
 const A=avds.map((a,i)=>{const n=vis.filter(k=>k.avdId===a.id).length;const isSel=sel&&sel.t==='avd'&&sel.k===a.id;
  return`<button class="ktile ${n?'':'none'} ${isSel?'sel':sel&&!near.has(a.id)?'dim':''}" data-act="ksel" data-t="avd" data-k="${esc(a.id)}" data-an="${esc(a.id)}">${a.parent?'<small>Prosjekt</small>':''}${esc(a.navn)}${n?`<span class="kn">${n}</span>`:''}</button>`}).join('');
 const uten=all.filter(l=>!base.some(k=>kLk(k)===l.key)).length;
 const fagN=f=>base.filter(k=>(k.fag||[]).includes(f)).length;const fagList=[...new Set([...LAEREFAG,...base.flatMap(k=>k.fag||[])])].sort((a,b)=>a.localeCompare(b,'no'));
 const avdOpts=S.avd.filter(a=>!a.gruppe||base.some(k=>k.avdId===a.id)).sort((a,b)=>avdNavn(a.id).localeCompare(avdNavn(b.id),'no'));
 const fsel=(k,lab,opts)=>`<label class="fld"><span>${lab}</span><select data-ch="kf" data-k="${k}" class="${ui.kF[k]?'on':''}">${opts}</select></label>`;
 const nF=['fag','avd','linje'].filter(k=>ui.kF[k]).length;
 const filterHtml=`<details class="kfd" ${filt||innerWidth>=761?'open':''}><summary>Filter${nF?` (${nF} aktive)`:''}</summary><div class="kfilt">${fsel('fag','Fag',opt('','Alle fag')+fagList.map(f=>opt(f,f+' ('+fagN(f)+')',ui.kF.fag===f)).join(''))}${fsel('avd','Avdeling',opt('','Alle avdelinger')+avdOpts.map(a=>opt(a.id,avdNavn(a.id),ui.kF.avd===a.id)).join(''))}${fsel('linje','Skolelinje',opt('','Alle skolelinjer')+all.map(l=>opt(l.key,(l.sk.kort||l.sk.navn)+' · '+l.trinn+' '+l.linje,ui.kF.linje===l.key)).join(''))}</div>
 <div class="row" style="margin-bottom:4px"><label class="chk"><input type="checkbox" data-ch="kskjul" ${ui.kSkjul?'checked':''}> Skjul linjer uten kobling</label>${filt?'<button class="btn sm" data-act="kfnull">Nullstill filter</button>':''}</div></details>`;
 const sk=cfg().skoler;
 return`<div class="row between"><h1>Avdelinger</h1><button class="btn pri" data-act="newavd">+ Ny avdeling</button></div>
 <nav class="seg" aria-label="Visning" style="margin:10px 0"><a href="#avdelinger">Register</a><a href="#koblinger" aria-current="page">Koblinger</a></nav>
 <p class="note">Hvilke linjer på hvilke skoler passer for hvilke avdelinger, og med hvilke fag. ${all.length} linjer · ${base.length} koblinger · ${uten} linjer uten avdeling.${filt?` <b>Filter: viser ${vis.length} ${vis.length===1?'kobling':'koblinger'}.</b>`:''}</p>
 <div class="filters" role="group" aria-label="Skole"><button data-act="kskole" data-k="alle" aria-pressed="${ui.kSkole==='alle'}">Alle skoler</button>${sk.map(s=>`<button data-act="kskole" data-k="${esc(s.id)}" aria-pressed="${ui.kSkole===s.id}"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${skFarge(s.id)};margin-right:6px"></span>${esc(s.kort||s.navn)}</button>`).join('')}</div>
 ${filterHtml}
 <div class="kwrap"><div><div class="kmap" id="kmap"><svg class="kwires" id="kwires" aria-hidden="true"></svg><div class="klabels" id="klabels"></div>
  <div class="kcol kl"><div class="khead">Skolelinjer</div>${L||`<span class="kv">${filt?'Ingen koblinger passer filteret.':ui.kSkjul?'Ingen koblede linjer ennå. Ta bort haken for «Skjul linjer uten kobling» for å se alle linjene og legge til koblinger.':'Ingen linjer'}</span>`}</div>
  <div class="kcol kr"><div class="khead" style="text-align:right">Avdelinger</div>${A}</div></div>${sel?'<div class="kspacer"></div>':''}</div>
 ${kPanel()}</div>`}

 <div class="blk"><h3>Sendt?</h3>${sd?`<p style="margin:0 0 10px"><span class="sent">Merket sendt ${fy(sd)}</span></p><button class="btn sm" data-act="unsend" data-id="${esc(id)}" data-key="${key}" data-li="${esc(li)}">Angre</button>`:`<div class="row"><input type="date" id="m-dato" value="${today()}" style="max-width:200px" aria-label="Dato sendt"><button class="btn pri" data-act="send" data-id="${esc(id)}" data-key="${key}" data-li="${esc(li)}">Merk som sendt</button></div><p class="kv">Systemet sender ingenting selv. Send e-posten fra Outlook og huk av her.</p>`}</div></div>`}
function setSent(id,key,li,d){const r=getReq(id);r.sendt=r.sendt||{};
 if(key.startsWith('skole')){if(d){r.sendt[key]=d;if(!r.forsteSvar)r.forsteSvar=d}else{delete r.sendt[key];if(!Object.keys(r.sendt).length)r.forsteSvar=null}}
 else{const l=r.avd[+li],f=key==='henvendelse'?'henvendt':key;l[f]=d||null}
 logg(r,(d?'Sendt: ':'Angret sendt: ')+MALNAVN[key]+(li!==''&&li!=null&&r.avd[+li]?' – '+avdNavn(r.avd[+li].avdId):''));upReq(r)}

const SKRIV_MELD='<p class="note warn" role="alert" style="border:2px solid #d4343a"><b>Du har ikke skrivetilgang til denne oversikten.</b> Endringer du gjør, blir ikke lagret. Be Mats gi deg tilgangen «Can edit» via «Del».</p>';
/* ---------- rendering ---------- */
function curView(){const h=location.hash.slice(1);return NAV.some(n=>n[0]===h)||h==='koblinger'?h:'i-dag'}
function navHtml(bottom){const v=curView()==='koblinger'?'avdelinger':curView(),over=tasks().filter(x=>x.due&&x.due<=today()).length;
 return NAV.map(([k,l,d])=>`<a href="#${k}" ${v===k?'aria-current="page"':''}>${bottom?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`:''}${l}${k==='i-dag'&&over?`<span class="badge">${over}</span>`:''}</a>`).join('')}
function refresh(forceSheet=true){
 $('#tabs').innerHTML=navHtml(false);$('#bnav').innerHTML=navHtml(true);
 const v=curView();const banner=(lesTilgang?SKRIV_MELD:'')+(note?`<p class="note warn">${esc(note)}</p>`:'')+(mode==='laster'?'<p class="note">Kobler til lagring …</p>':mode==='lokal'?'<p class="note">Lokal modus – data lagres bare i denne nettleseren. Se Mer for eksport og import.</p>':'')+(S.req.some(r=>r.eksempel)&&v!=='mer'?'<p class="note"><span class="eks">EKSEMPEL</span> betyr oppdiktet testdata. Kan fjernes under Mer.</p>':'');
 const ae=document.activeElement;const keepQ=ae&&ae.id==='q'?[ae.selectionStart]:null;
 $('#view').innerHTML=banner+({'i-dag':vToday,'foresporsler':vReqs,'kalender':vCal,'avdelinger':vAvd,'koblinger':vKob,'mer':vMer}[v])();
 if(kro){kro.disconnect();kro=null}if(v==='koblinger'){drawK();kro=new ResizeObserver(()=>drawK());kro.observe($('#kmap'))}
 if(keepQ){const q=$('#q');q.focus();q.setSelectionRange(keepQ[0],keepQ[0])}
 renderSheet(forceSheet)}
function renderSheet(force){if(!sheet)return;const p=$('#panel');
 if(sheet.type!=='req'&&!force)return; // skjema og maler tegnes ikke om av ny data
 const ae=document.activeElement;if(!force&&p.contains(ae)&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)){pendingSheet=true;return}
 const top=p.scrollTop;p.innerHTML=sheet.type==='req'?shReq(sheet.id):sheet.type==='reqForm'?shReqForm(sheet.id):sheet.type==='avd'?shAvd(sheet.id,sheet.parent):sheet.type==='kob'?shKob(sheet.id):sheet.type==='paste'?shPaste():shMal(sheet.id,sheet.key,sheet.li);if(lesTilgang){const b=p.querySelector('.sh-body');if(b)b.insertAdjacentHTML('afterbegin',SKRIV_MELD)}p.scrollTop=sheet.keepScroll?top:0;sheet.keepScroll=true;if(sheet.type==='reqForm')rcInit()}
function openSheet(s){sheet=s;$('#sheet').hidden=false;document.body.classList.add('noscroll');renderSheet(true)}
function closeSheet(){sheet=null;$('#sheet').hidden=true;document.body.classList.remove('noscroll');$('#panel').innerHTML=''}

/* ---------- hendelser ---------- */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset,a=d.act;
 if(a==='close')return closeSheet();
 if(a==='savereq')return saveReqForm(sheet.id);
 if(a==='rc-nav'){rc.m+=+d.n;if(rc.m<0){rc.m=11;rc.y--}if(rc.m>11){rc.m=0;rc.y++}return drawCal()}
 if(a==='rc-clear')return setRange('','');
 if(a==='rc-day'){const x=d.d,f=$('#f-fra').value,t=$('#f-til').value;if(!f||t||x<f)setRange(x,'');else setRange(f,x);return}
 if(a==='rc-week'){const mo=d.d,fr=addDays(mo,4),f=$('#f-fra').value,t=$('#f-til').value;
  if(f&&t&&mo>t)setRange(f,fr);else if(f&&!t&&fr>=f)setRange(f,fr);else if(f&&t&&fr<f)setRange(mo,t);else setRange(mo,fr);return}
 if(a==='saveavd')return saveAvd(sheet.id,sheet.parent);
 if(a==='req')return openSheet({type:'req',id:d.id});
 if(a==='newreq')return openSheet({type:'reqForm',id:null});
 if(a==='paste'){pasted=null;return openSheet({type:'paste'})}
 if(a==='paste2'){const x=parseSkjema($('#p-txt').value);pasted=x.o?skjemaTilReq(x.o):null;$('#p-prev').innerHTML=x.err?`<div class="note warn">${esc(x.err)}</div>`:prevSkjema(pasted);return}
 if(a==='paste3'){if(pasted)opprettFraSkjema(pasted,$('#p-mottatt').value||today());return}
 if(a==='editreq')return openSheet({type:'reqForm',id:d.id});
 if(a==='mal')return openSheet({type:'mal',id:d.id,key:d.key,li:d.li});
 if(a==='newavd')return openSheet({type:'avd',id:null,parent:d.parent||null});
 if(a==='editavd')return openSheet({type:'avd',id:d.id});
 if(a==='filter'){ui.filter=d.k;return refresh()}
 if(a==='ksel'){ui.kSel=ui.kSel&&ui.kSel.t===d.t&&ui.kSel.k===d.k?null:{t:d.t,k:d.k};refresh();const el=document.querySelector('.ktile.sel');if(el&&innerWidth<1000){const y=el.getBoundingClientRect().top;if(y<70||y>innerHeight*.45)scrollTo({top:scrollY+y-90,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}return}
 if(a==='kclose'){ui.kSel=null;return refresh()}
 if(a==='kskole'){ui.kSkole=d.k;if(ui.kF.linje&&!ui.kF.linje.startsWith(d.k+'|')&&d.k!=='alle')ui.kF.linje='';return refresh()}
 if(a==='kfnull'){ui.kF={fag:'',avd:'',linje:''};return refresh()}
 if(a==='copyv'){copyText(d.v);return}
 if(a==='kgo'){ui.kSel={t:'avd',k:d.id};if(location.hash==='#koblinger')refresh();else location.hash='#koblinger';return}
 if(a==='kedit')return openSheet({type:'kob',id:d.id});
 if(a==='kadd'){const v=$('#kAdd').value;if(!v)return;let k;if(ui.kSel.t==='linje'){const[sk,t,l]=ui.kSel.k.split('|');const av=avdBy(v);k={id:nyId('k'),skole:sk,trinn:t,linje:l,avdId:v,fag:(av?.fag||[]).slice()}}else{const[sk,t,l]=v.split('|');const av=avdBy(ui.kSel.k);k={id:nyId('k'),skole:sk,trinn:t,linje:l,avdId:ui.kSel.k,fag:(av?.fag||[]).slice()}}
  S.kob.push(k);put('koblinger',k);refresh();return toast('Koblet. Juster fag ved behov.')}
 if(a==='ksave'){const k=clone(S.kob.find(x=>x.id===d.id));k.fag=[...new Set([...[...document.querySelectorAll('input[name=kfag]:checked')].map(x=>x.value),...$('#k-andre').value.split(',').map(x=>x.trim()).filter(Boolean)])];const i=S.kob.findIndex(x=>x.id===k.id);S.kob[i]=k;put('koblinger',k);closeSheet();refresh();return toast('Lagret')}
 if(a==='kdel'){$('#kdelConf').innerHTML=`<div class="confirm">Fjerne koblingen? <button class="btn sm dan" data-act="kdel2" data-id="${esc(d.id)}">Ja, fjern</button></div>`;return}
 if(a==='kdel2'){S.kob=S.kob.filter(x=>x.id!==d.id);del('koblinger',d.id);closeSheet();refresh();return toast('Koblingen er fjernet')}
 if(a==='senere'){ui.senere=!ui.senere;return refresh()}
 if(a==='cal'){const n=+d.d;ui.calStart=n?addDays(ui.calStart,n*7):addDays(monday(today()),-7);return refresh()}
 if(a==='tri'){e.preventDefault();const s=(+b.dataset.s+1)%3;b.dataset.s=s;b.textContent=b.dataset.f+(s===2?' ?':'');return}
 if(a==='ingen'){const r=getReq(d.id),l=r.avd[+d.li];l.status='ingen';l.svarDato=today();logg(r,'Ingen tilbakemelding fra '+avdNavn(l.avdId)+' etter 2. purring');upReq(r);return openSheet({type:'req',id:r.id})}
 if(a==='copy'){const el=$('#'+d.t);try{await navigator.clipboard.writeText(el.value);toast('Kopiert')}catch(err){el.focus();el.select();try{document.execCommand('copy');toast('Kopiert')}catch(e2){toast('Marker teksten og kopier manuelt')}}return}
 if(a==='send'){setSent(d.id,d.key,d.li,$('#m-dato').value||today());toast('Merket som sendt');return openSheet({type:'req',id:d.id})}
 if(a==='unsend'){setSent(d.id,d.key,d.li,null);return renderSheet(true)}
 if(a==='bruk'){const r=getReq(sheet.id);setStatus(r,d.s);if(d.a)r.avslag=d.a;upReq(r);return}
 if(a==='addline'){const r=getReq(sheet.id);const id=$('#addAvd').value;(r.avd=r.avd||[]).push({avdId:id,status:'venter',lagtTil:today()});logg(r,'Spurt: '+avdNavn(id));upReq(r);return}
 if(a==='rmline'){const r=getReq(sheet.id);const l=r.avd.splice(+d.li,1)[0];logg(r,'Fjernet avdeling: '+avdNavn(l.avdId));upReq(r);return}
 if(a==='delreq'){$('#delConf').innerHTML=`<div class="confirm">Slette ${esc(sheet.id)} for godt? <button class="btn sm dan" data-act="delreq2">Ja, slett</button></div>`;return}
 if(a==='delreq2'){const id=sheet.id;S.req=S.req.filter(r=>r.id!==id);del('foresporsler',id);closeSheet();refresh();return toast('Slettet')}
 if(a==='delavd'){const inUse=S.req.some(r=>(r.avd||[]).some(l=>l.avdId===d.id));$('#delAConf').innerHTML=`<div class="confirm">${inUse?'Avdelingen er brukt i forespørsler. Der vises den som «fjernet avdeling». ':''}Fjerne for godt? <button type="button" class="btn sm dan" data-act="delavd2" data-id="${esc(d.id)}">Ja, fjern</button></div>`;return}
 if(a==='delavd2'){S.avd=S.avd.filter(x=>x.id!==d.id);del('avdelinger',d.id);for(const k of S.kob.filter(k=>k.avdId===d.id))del('koblinger',k.id);S.kob=S.kob.filter(k=>k.avdId!==d.id);if(ui.kSel?.k===d.id)ui.kSel=null;closeSheet();refresh();return toast('Fjernet')}
 if(a==='addskole'){const n=$('#nySkole').value.trim(),k=$('#nyKort').value.trim();if(!n)return toast('Skriv inn navnet på skolen');const c=clone(cfg());c.skoler.push({id:'s'+Date.now().toString(36),navn:n,kort:k||n,linjer:{Vg1:[],Vg2:[],Vg3:[]}});upCfg(c);return toast('Skole lagt til')}
 if(a==='skolelinje'){const box=b.parentElement;if(box.querySelector('.addl'))return;box.insertAdjacentHTML('beforeend',`<div class="addl row" style="width:100%"><select style="max-width:110px" aria-label="Trinn">${['Vg1','Vg2','Vg3'].map(t=>opt(t,t)).join('')}</select><input type="text" placeholder="Navn på linje" style="flex:1 1 180px"><button class="btn sm pri" data-act="skolelinje2" data-id="${esc(d.id)}">Legg til</button></div>`);return}
 if(a==='skolelinje2'){const w=b.parentElement,t=w.querySelector('select').value,n=w.querySelector('input').value.trim();if(!n)return;const c=clone(cfg());const s=c.skoler.find(x=>x.id===d.id);s.linjer=s.linjer||{};(s.linjer[t]=s.linjer[t]||[]).push(n);upCfg(c);return toast('Linje lagt til')}
 if(a==='fjerneks'){$('#eksConf').innerHTML='<div class="confirm">Fjerne alle eksempelforespørsler? <button class="btn sm dan" data-act="fjerneks2">Ja, fjern</button></div>';return}
 if(a==='fjerneks2'){const ids=S.req.filter(r=>r.eksempel).map(r=>r.id);S.req=S.req.filter(r=>!r.eksempel);for(const id of ids)await del('foresporsler',id);const c=clone(cfg());if(c.skoler.some(s=>s.eksempel)){c.skoler=c.skoler.filter(s=>!s.eksempel);upCfg(c)}refresh();return toast('Eksempler fjernet')}
 if(a==='lister'){const t=listerJs();$('#lbox').innerHTML=`<label class="fld" style="margin-top:12px"><span>Innhold i utplassering/lister.js (oppdatert ${fy(today())})</span><textarea id="ltxt" rows="10" readonly>${esc(t)}</textarea></label><button class="btn pri" data-act="copy" data-t="ltxt">Kopier på nytt</button>`;copyText(t,$('#ltxt'));return}
 if(a==='export'){const json=JSON.stringify({type:'utplassering-eksport',versjon:1,eksportert:today(),avd:S.avd,req:S.req,kob:S.kob,cfg:cfg()},null,1);
  $('#xbox').innerHTML=`<label class="fld" style="margin-top:12px"><span>Eksport (${S.req.length} forespørsler, ${S.avd.length} avdelinger, ${S.kob.length} koblinger)</span><textarea id="xtxt" rows="8" readonly>${esc(json)}</textarea></label><div class="row"><button class="btn pri" data-act="copy" data-t="xtxt">Kopier</button>${mode==='lokal'?'<button class="btn" data-act="dl">Last ned fil</button>':''}</div><p class="kv">Lim inn i «Importer» på den andre maskinen, eller lagre teksten som en fil.</p>`;return}
 if(a==='dl'){try{const u=URL.createObjectURL(new Blob([$('#xtxt').value],{type:'application/json'}));const x=document.createElement('a');x.href=u;x.download='utplassering-'+today()+'.json';document.body.appendChild(x);x.click();x.remove()}catch(err){toast('Nedlasting virker ikke her – bruk Kopier')}return}
 if(a==='import'){$('#xbox').innerHTML=`<label class="fld" style="margin-top:12px"><span>Lim inn eksport, eller velg fil</span><textarea id="itxt" rows="6"></textarea></label><input type="file" id="ifil" accept=".json,application/json" style="margin-bottom:10px"><div class="confirm">Import erstatter alle avdelinger, koblinger, forespørsler og innstillinger her. <button class="btn sm dan" data-act="import2">Importer og erstatt</button></div>`;return}
 if(a==='import2'){let x;try{x=JSON.parse($('#itxt').value)}catch(err){return toast('Teksten er ikke en gyldig eksport')}
  if(!x||x.type!=='utplassering-eksport'||!Array.isArray(x.avd)||!Array.isArray(x.req))return toast('Teksten er ikke en gyldig eksport');
  b.disabled=true;b.textContent='Importerer …';const oldA=S.avd.map(v=>v.id),oldR=S.req.map(v=>v.id),oldK=S.kob.map(v=>v.id);
  S.avd=x.avd;S.req=x.req;S.kob=Array.isArray(x.kob)?x.kob:[];S.cfg=x.cfg||null;migrer();normAll();
  if(mode==='db'){for(const v of x.avd)await put('avdelinger',v);for(const v of x.req)await put('foresporsler',v);for(const id of oldA)if(!x.avd.some(v=>v.id===id))await del('avdelinger',id);for(const id of oldR)if(!x.req.some(v=>v.id===id))await del('foresporsler',id);for(const v of S.kob)await put('koblinger',v);for(const id of oldK)if(!S.kob.some(v=>v.id===id))await del('koblinger',id);if(x.cfg)await put('config',Object.assign({id:'main'},x.cfg))}else saveLocal();
  refresh();return toast('Importert')}
});
document.addEventListener('change',e=>{const el=e.target,d=el.dataset;{const f=el.closest?.('.fld.err');if(f&&(el.type==='checkbox'?el.checked:(el.value||'').trim())){f.classList.remove('err');f.querySelector('.errtxt')?.remove();el.removeAttribute('aria-invalid')}}
 if(el.id==='ifil'&&el.files[0]){el.files[0].text().then(t=>{$('#itxt').value=t});return}
 if(el.id==='f-fra'||el.id==='f-til'){if(el.id==='f-fra'&&el.value){const x=pd(el.value);rc={y:x.getFullYear(),m:x.getMonth()}}drawCal();return}
 if(el.id==='f-skole'||el.id==='f-trinn'){const s=skole($('#f-skole').value),ln=(s?.linjer||{})[$('#f-trinn').value]||[];$('#f-linje').innerHTML=ln.map(l=>opt(l,l)).join('')||opt('','Ingen linjer – legg til under Mer');return}
 if(d.ch==='calAvslag'){ui.calAvslag=el.checked;return refresh()}
 if(d.ch==='kf'){ui.kF[d.k]=el.value;ui.kSel=null;return refresh()}
 if(d.ch==='kskjul'){ui.kSkjul=el.checked;return refresh()}
 if(d.ch==='felles'){const c=clone(cfg());c.felles=Object.assign({},c.felles||{},{[d.k]:el.value.trim()});upCfg(c);return toast('Lagret')}
 if(d.ch==='forms'){const c=clone(cfg());c.forms=el.value.trim();upCfg(c);return toast('Lagret')}
 if(d.ch==='frist'){const c=clone(cfg());c.frister=Object.assign({},F(),{[d.k]:Math.max(0,+el.value||0)});upCfg(c);return toast('Frist lagret')}
 if(!d.ch||!sheet||sheet.type!=='req')return;
 const r=getReq(sheet.id);const l=d.li!==undefined?r.avd[+d.li]:null;
 if(d.ch==='status'){setStatus(r,el.value)}
 else if(d.ch==='ps'){r.psSendt=el.checked?today():null;logg(r,el.checked?'Personalskjema sendt til Ankomstsenteret':'Avhuking for personalskjema fjernet')}
 else if(d.ch==='avslag'){r.avslag=el.value;logg(r,'Avslagsårsak: '+el.value)}
 else if(d.ch==='avslagtekst'){r.avslagTekst=el.value}
 else if(d.ch==='lstatus'){const was=l.status;l.status=el.value;if(was==='venter'&&el.value!=='venter')l.svarDato=today();if(el.value==='ja'&&l.antall==null){const{b,res}=cnt(r);l.antall=Math.max(1,(+r.antall||0)-b-res)}logg(r,avdNavn(l.avdId)+': '+L2M[el.value].n)}
 else if(d.ch==='lantall'){l.antall=Math.max(0,+el.value||0)}
 else if(d.ch==='lavklart'){l.avklart=el.checked;logg(r,avdNavn(l.avdId)+': kontaktperson og oppmøtested '+(el.checked?'avklart':'ikke avklart'))}
 else if(d.ch==='larsak'){l.arsak=el.value}else if(d.ch==='larsaktekst'){l.arsakTekst=el.value}
 else if(d.ch==='lsjekk'){l.nySjekk=el.value}
 upReq(r)});
function setStatus(r,s){if(r.status===s)return;r.status=s;r.statusDato=today();if(s==='mottatt'&&!r.mottatt)r.mottatt=today();logg(r,'Status: '+SM[s].n)}
document.addEventListener('input',e=>{const f=e.target.closest?.('.fld.err');if(f&&e.target.type!=='checkbox'&&(e.target.value||'').trim()){f.classList.remove('err');f.querySelector('.errtxt')?.remove();e.target.removeAttribute('aria-invalid')}
 if(e.target.id==='q'){ui.q=e.target.value;refresh(false)}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='rf')saveReqForm(sheet.id);if(e.target.id==='af')saveAvd(sheet.id,sheet.parent)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches?.('#rf input,#af input')){e.preventDefault();e.target.closest('#rf')?saveReqForm(sheet.id):saveAvd(sheet.id,sheet.parent)}});
document.addEventListener('focusout',()=>{if(pendingSheet)setTimeout(()=>{const ae=document.activeElement;if(!$('#panel').contains(ae)||!/^(INPUT|TEXTAREA)$/.test(ae.tagName)){pendingSheet=false;renderSheet(true)}},0)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet)closeSheet()});
addEventListener('hashchange',()=>{window.scrollTo(0,0);refresh(false)});

/* ---------- oppstart ---------- */
refresh();
(async()=>{let w=0;while(!(window.claude&&typeof window.claude.use==='function')&&w<20){await new Promise(r=>setTimeout(r,100));w++}
 let d=null;if(window.claude&&typeof window.claude.use==='function'){try{d=await window.claude.use('db')}catch(e){d=null}}
 if(d){db=d;mode='db';startDb();try{const u=await window.claude.use('user');const kan=u&&u.can?await u.can('data.write'):null;if(kan===false){lesTilgang=true;sched()}}catch(e){}}else{mode='lokal';startLocal()}refresh(false)})();
}
</script>
